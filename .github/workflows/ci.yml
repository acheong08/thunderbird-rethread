name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: node --test test/core.test.js

      - name: Build
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: rethread-xpi
          path: dist/*.xpi
